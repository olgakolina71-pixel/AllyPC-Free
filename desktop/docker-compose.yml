services:
  desktop:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    container_name: codespace-desktop
    security_opt:
      - seccomp:unconfined
    shm_size: "1gb"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
      CUSTOM_USER: "${DESKTOP_USER:-player}"
      PASSWORD: "${DESKTOP_PASSWORD:?Run start-desktop.sh to create a password}"
    ports:
      - "3000:3000"
    volumes:
      - desktop-config:/config
    restart: unless-stopped

volumes:
  desktop-config:
